<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Performa Sales (Fast & Optimized)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 p-6">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Header Section -->
        <div class="flex flex-col md:flex-row justify-between items-center bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <div class="flex items-center space-x-4">
                <img id="logo" src="https://lh3.googleusercontent.com/d/1_S5-p8s8c5c-X3m9-A82I9xZ4w1w6Z8" 
                     onerror="this.src='https://via.placeholder.com/60?text=CPA'" 
                     alt="CPA Logo" class="h-12 w-auto">
                <div>
                    <h1 class="text-2xl font-bold text-slate-900">Dashboard Performa Sales</h1>
                    <p class="text-sm text-slate-500" id="status-loading">Siap memuat data...</p>
                </div>
            </div>
            <button id="btn-refresh" onclick="loadData()" class="mt-4 md:mt-0 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2">
                <span id="icon-spin" class="hidden animate-spin">🔄</span>
                <span>Refresh Data</span>
            </button>
        </div>

        <!-- Summary Metric Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Target</p>
                <h2 class="text-3xl font-extrabold text-slate-800 mt-2" id="metric-target">0</h2>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Actual</p>
                <h2 class="text-3xl font-extrabold text-blue-600 mt-2" id="metric-actual">0</h2>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Pencapaian (%)</p>
                <h2 class="text-3xl font-extrabold text-emerald-600 mt-2" id="metric-achievement">0%</h2>
            </div>
        </div>

        <!-- Tables Section: Top 10 Workplace & Top 5 DSR -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            
            <!-- TOP 10 Workplace -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                    🏆 Top 10 Workplace (Actual Terbesar)
                </h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-slate-600">
                        <thead class="bg-slate-50 text-xs uppercase text-slate-500 border-b">
                            <tr>
                                <th class="p-3">#</th>
                                <th class="p-3">Workplace Name</th>
                                <th class="p-3 text-right">Actual</th>
                            </tr>
                        </thead>
                        <tbody id="table-top-workplace">
                            <tr><td colspan="3" class="p-4 text-center text-slate-400">Belum ada data</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- TOP 5 DSR -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                    🌟 Top 5 DSR (Actual Terbesar)
                </h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-slate-600">
                        <thead class="bg-slate-50 text-xs uppercase text-slate-500 border-b">
                            <tr>
                                <th class="p-3">#</th>
                                <th class="p-3">DSR Name</th>
                                <th class="p-3 text-right">Actual</th>
                            </tr>
                        </thead>
                        <tbody id="table-top-dsr">
                            <tr><td colspan="3" class="p-4 text-center text-slate-400">Belum ada data</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </div>

    <script>
        const BASE_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR_EXAMPLE_URL_HERE/pub?output=csv';

        function parseNum(val) {
            if (!val) return 0;
            let cleaned = val.toString().replace(/[^0-9.-]+/g, "");
            return parseFloat(cleaned) || 0;
        }

        function setLoadingState(isLoading) {
            const btn = document.getElementById('btn-refresh');
            const icon = document.getElementById('icon-spin');
            const status = document.getElementById('status-loading');

            if (isLoading) {
                btn.disabled = true;
                btn.classList.add('opacity-50', 'cursor-not-allowed');
                icon.classList.remove('hidden');
                status.innerText = "Mengunduh & memproses data terbaru...";
            } else {
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
                icon.classList.add('hidden');
            }
        }

        function loadData() {
            setLoadingState(true);

            // Trik Cache-Busting: Tambahkan parameter timestamp agar request tidak di-cache oleh browser
            const freshUrl = BASE_CSV_URL + '&t=' + new Date().getTime();

            Papa.parse(freshUrl, {
                download: true,
                header: true,
                skipEmptyLines: 'greedy', // Hapus baris kosong agar memori lebih hemat
                fastMode: true,           // Aktifkan mode cepat jika format CSV standar
                complete: function(results) {
                    // Gunakan setTimeout agar UI browser sempat bernapas (tidak freeze)
                    setTimeout(() => {
                        processAllData(results.data);
                        setLoadingState(false);
                        document.getElementById('status-loading').innerText = "Diperbarui: " + new Date().toLocaleTimeString();
                    }, 50);
                },
                error: function(err) {
                    console.error(err);
                    setLoadingState(false);
                    document.getElementById('status-loading').innerText = "Gagal memuat data. Periksa koneksi/URL.";
                }
            });
        }

        // Proses agregasi sekaligus dalam 1 x looping (Sangat Menghemat Performa)
        function processAllData(data) {
            let totalTarget = 0;
            let totalActual = 0;
            const workplaceMap = {};
            const dsrMap = {};

            for (let i = 0; i < data.length; i++) {
                const row = data[i];
                const target = parseNum(row['Target Jul 26']);
                const actual = parseNum(row['Actual Jul 26']);
                
                totalTarget += target;
                totalActual += actual;

                // Group Workplace
                const wp = row['Workplace Name'];
                if (wp) workplaceMap[wp] = (workplaceMap[wp] || 0) + actual;

                // Group DSR
                const dsr = row['DSR Name'];
                if (dsr) dsrMap[dsr] = (dsrMap[dsr] || 0) + actual;
            }

            // Render Metrics
            const achievement = totalTarget > 0 ? ((totalActual / totalTarget) * 100).toFixed(1) : 0;
            document.getElementById('metric-target').innerText = totalTarget.toLocaleString('id-ID');
            document.getElementById('metric-actual').innerText = totalActual.toLocaleString('id-ID');
            document.getElementById('metric-achievement').innerText = achievement + '%';

            // Render Workplace TOP 10
            const sortedWp = Object.keys(workplaceMap)
                .map(key => ({ name: key, actual: workplaceMap[key] }))
                .sort((a, b) => b.actual - a.actual)
                .slice(0, 10);

            document.getElementById('table-top-workplace').innerHTML = sortedWp.map((item, index) => `
                <tr class="border-b hover:bg-slate-50 transition">
                    <td class="p-3 font-semibold text-slate-400">${index + 1}</td>
                    <td class="p-3 font-medium text-slate-800">${item.name}</td>
                    <td class="p-3 text-right font-bold text-blue-600">${item.actual.toLocaleString('id-ID')}</td>
                </tr>
            `).join('');

            // Render DSR TOP 5
            const sortedDsr = Object.keys(dsrMap)
                .map(key => ({ name: key, actual: dsrMap[key] }))
                .sort((a, b) => b.actual - a.actual)
                .slice(0, 5);

            document.getElementById('table-top-dsr').innerHTML = sortedDsr.map((item, index) => `
                <tr class="border-b hover:bg-slate-50 transition">
                    <td class="p-3 font-semibold text-slate-400">${index + 1}</td>
                    <td class="p-3 font-medium text-slate-800">${item.name}</td>
                    <td class="p-3 text-right font-bold text-emerald-600">${item.actual.toLocaleString('id-ID')}</td>
                </tr>
            `).join('');
        }

        window.onload = loadData;
    </script>
</body>
</html>
