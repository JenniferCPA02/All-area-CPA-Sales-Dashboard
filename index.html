<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Performa Sales</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse untuk memproses CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 p-6">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Header Section -->
        <div class="flex flex-col md:flex-row justify-between items-center bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <div class="flex items-center space-x-4">
                <img id="logo" src="https://lh3.googleusercontent.com/d/1_S5-p8s8c5c-X3m9-A82I9xZ4w1w6Z8" 
                     onerror="this.src='https://via.placeholder.com/60?text=CPA'" 
                     alt="CPA Logo" class="h-12 w-auto">
                <div>
                    <h1 class="text-2xl font-bold text-slate-900">Dashboard Performa Sales</h1>
                    <p class="text-sm text-slate-500" id="status-loading">Memuat data dari Google Sheets...</p>
                </div>
            </div>
            <button onclick="loadData()" class="mt-4 md:mt-0 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
                🔄 Refresh Data
            </button>
        </div>

        <!-- Summary Metric Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Target</p>
                <h2 class="text-3xl font-extrabold text-slate-800 mt-2" id="metric-target">0</h2>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Actual</p>
                <h2 class="text-3xl font-extrabold text-blue-600 mt-2" id="metric-actual">0</h2>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Pencapaian (%)</p>
                <h2 class="text-3xl font-extrabold text-emerald-600 mt-2" id="metric-achievement">0%</h2>
            </div>
        </div>

        <!-- Tables Section: Top 10 Workplace & Top 5 DSR -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            
            <!-- TOP 10 Workplace -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                    🏆 Top 10 Workplace (Actual Terbesar)
                </h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-slate-600">
                        <thead class="bg-slate-50 text-xs uppercase text-slate-500 border-b">
                            <tr>
                                <th class="p-3">#</th>
                                <th class="p-3">Workplace Name</th>
                                <th class="p-3 text-right">Actual</th>
                            </tr>
                        </thead>
                        <tbody id="table-top-workplace">
                            <tr><td colspan="3" class="p-4 text-center text-slate-400">Sedang memuat...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- TOP 5 DSR -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                    🌟 Top 5 DSR (Actual Terbesar)
                </h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-slate-600">
                        <thead class="bg-slate-50 text-xs uppercase text-slate-500 border-b">
                            <tr>
                                <th class="p-3">#</th>
                                <th class="p-3">DSR Name</th>
                                <th class="p-3 text-right">Actual</th>
                            </tr>
                        </thead>
                        <tbody id="table-top-dsr">
                            <tr><td colspan="3" class="p-4 text-center text-slate-400">Sedang memuat...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </div>

    <script>
        // ⚠️ GANTI URL DI BAWAH DENGAN URL CSV GOOGLE SHEETS ANDA YANGBERTIPE PUBLIK
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR_EXAMPLE_URL_HERE/pub?output=csv';

        function loadData() {
            document.getElementById('status-loading').innerText = "Memperbarui data...";

            Papa.parse(CSV_URL, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    const data = results.data;
                    document.getElementById('status-loading').innerText = "Data berhasil diperbarui: " + new Date().toLocaleTimeString();
                    
                    processMetrics(data);
                    renderTopWorkplace(data);
                    renderTopDSR(data);
                },
                error: function(err) {
                    console.error(err);
                    document.getElementById('status-loading').innerText = "Gagal memuat data Google Sheets.";
                }
            });
        }

        // Helper untuk parse angka aman dari CSV
        function parseNum(val) {
            if (!val) return 0;
            let cleaned = val.toString().replace(/[^0-9.-]+/g, "");
            return parseFloat(cleaned) || 0;
        }

        // 1. Hitung Ringkasan Metrics
        function processMetrics(data) {
            let totalTarget = 0;
            let totalActual = 0;

            data.forEach(row => {
                totalTarget += parseNum(row['Target Jul 26']);
                totalActual += parseNum(row['Actual Jul 26']);
            });

            const achievement = totalTarget > 0 ? ((totalActual / totalTarget) * 100).toFixed(1) : 0;

            document.getElementById('metric-target').innerText = totalTarget.toLocaleString('id-ID');
            document.getElementById('metric-actual').innerText = totalActual.toLocaleString('id-ID');
            document.getElementById('metric-achievement').innerText = achievement + '%';
        }

        // 2. Render Tabel TOP 10 Workplace
        function renderTopWorkplace(data) {
            // Grouping berdasarkan Workplace Name
            const map = {};
            data.forEach(row => {
                const name = row['Workplace Name'] || 'Unassigned';
                const actual = parseNum(row['Actual Jul 26']);
                map[name] = (map[name] || 0) + actual;
            });

            // Convert ke Array & Sort
            const sorted = Object.keys(map)
                .map(key => ({ name: key, actual: map[key] }))
                .sort((a, b) => b.actual - a.actual)
                .slice(0, 10); // Ambil TOP 10

            // Render ke HTML
            const tbody = document.getElementById('table-top-workplace');
            tbody.innerHTML = sorted.map((item, index) => `
                <tr class="border-b hover:bg-slate-50 transition">
                    <td class="p-3 font-semibold text-slate-400">${index + 1}</td>
                    <td class="p-3 font-medium text-slate-800">${item.name}</td>
                    <td class="p-3 text-right font-bold text-blue-600">${item.actual.toLocaleString('id-ID')}</td>
                </tr>
            `).join('');
        }

        // 3. Render Tabel TOP 5 DSR
        function renderTopDSR(data) {
            // Grouping berdasarkan DSR Name
            const map = {};
            data.forEach(row => {
                const name = row['DSR Name'] || 'Unassigned';
                const actual = parseNum(row['Actual Jul 26']);
                map[name] = (map[name] || 0) + actual;
            });

            // Convert ke Array & Sort
            const sorted = Object.keys(map)
                .map(key => ({ name: key, actual: map[key] }))
                .sort((a, b) => b.actual - a.actual)
                .slice(0, 5); // Ambil TOP 5

            // Render ke HTML
            const tbody = document.getElementById('table-top-dsr');
            tbody.innerHTML = sorted.map((item, index) => `
                <tr class="border-b hover:bg-slate-50 transition">
                    <td class="p-3 font-semibold text-slate-400">${index + 1}</td>
                    <td class="p-3 font-medium text-slate-800">${item.name}</td>
                    <td class="p-3 text-right font-bold text-emerald-600">${item.actual.toLocaleString('id-ID')}</td>
                </tr>
            `).join('');
        }

        // Jalankan saat pertama kali halaman di-load
        window.onload = loadData;
    </script>
</body>
</html>
